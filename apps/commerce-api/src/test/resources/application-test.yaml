datasource:
  mysql-jpa:
    main:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:commerce-api;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
      username: sa
      password: ""
      maximum-pool-size: 10
      minimum-idle: 1

spring:
  sql:
    init:
      mode: never
  kafka:
    producer:
      properties:
        max.block.ms: 500

outbox:
  relay:
    enabled: false

coupon:
  issue-consumer:
    auto-startup: false

queue:
  scheduler:
    enabled: false
